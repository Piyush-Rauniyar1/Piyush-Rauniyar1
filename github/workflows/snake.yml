name: Generate Snake

# Disabled automatic runs and write permissions to avoid modifying repositories or contribution artifacts.
on:
  workflow_dispatch: # manual trigger only

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (manual run only)
        uses: Platane/snk@v3
        with:
          github_user_name: Piyush-Rauniyar1
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Deployment is intentionally disabled to prevent automatic commits or branch writes.
      # If you want to publish generated assets, re-enable the section below and ensure you
      # understand the side effects (it will push files to the target branch).
      # - name: Deploy to output branch
      #   uses: crazy-max/ghaction-github-pages@v4
      #   with:
      #     target_branch: output
      #     build_dir: dist
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
